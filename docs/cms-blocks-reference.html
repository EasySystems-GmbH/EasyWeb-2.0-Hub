<!--
  Entwickler-Referenz: CMS-Block-Markup zum Nachschlagen.
  Liegt unter docs/ — KEINE öffentliche Seite, NICHT unter Pages/ oder Themes/.
  Nicht publishen / nicht in WebDAV legen.

  Regeln: Nur offizielle Blöcke. Keine Custom-Divs zum Gestalten.
  Abstände/Maße/Rahmen → Stile-Panel → contentCss (#ew-e-…).
  Globales Design → Einstellungen → Design (site-theme → main.css).
  custom.css nur Notfall. Raw-HTML nur Code-(HTML)-Zone.
-->

<!-- Abschnitt -->
<section class="wf-editable" data-ew-container="container">
  <div class="container">
    <!-- Inhalt -->
  </div>
</section>

<!-- Text (ein Block pro wf-editable) -->
<div class="wf-editable"><h2>Titel</h2></div>
<div class="wf-editable"><p>Fliesstext.</p></div>

<!-- Liste -->
<div class="wf-editable">
  <ul class="ew-list-block">
    <li>Punkt 1</li>
    <li>Punkt 2</li>
  </ul>
</div>

<!-- Bild -->
<div class="wf-editable">
  <img src="/images/beispiel.jpg" alt="Beschreibung" class="img-fluid ew-image">
</div>

<!-- Schaltfläche (neben Text-Wrapper, nicht darin) -->
<a href="/de/kontakt" class="btn btn-primary ew-btn">Kontakt</a>

<!-- Feature-Box (Bootstrap-Card — NICHT die Standort-Karte / ew-map) -->
<div class="card wf-editable">
  <div class="card-body">
    <div class="wf-editable"><h3 class="h5 card-title">Feature</h3></div>
    <div class="wf-editable"><p class="card-text mb-0">Text</p></div>
  </div>
</div>

<!-- Hinweis -->
<div class="alert alert-info wf-editable" role="alert">Hinweis</div>

<!-- Spalten (Spalten-Block — ew-layout-row ist Pflicht) -->
<div class="row g-3 ew-layout-row">
  <div class="col-md-6">
    <div class="wf-editable"><p>Spalte 1</p></div>
  </div>
  <div class="col-md-6">
    <div class="wf-editable"><p>Spalte 2</p></div>
  </div>
</div>

<!-- Trennlinie (kein wf-editable) -->
<hr class="ew-divider" />

<!-- Slider — Bilder zusätzlich in .meta.json → sliders -->
<div id="ew-slider-main" class="carousel slide ew-slider wf-editable"
     data-bs-ride="carousel" data-bs-interval="5000"
     data-ew-images-per-slide="1" data-ew-show-nav="true" data-ew-show-indicators="true">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <div class="ew-slider-slide">
        <div class="ew-slider-media">
          <div class="ew-slider-frame">
            <div class="ew-slider-images row g-0">
              <div class="col-12 ew-slider-image-cell">
                <img src="/images/ordner/bild.jpg" class="w-100 ew-slider-image" alt="Alt"
                     style="object-fit:cover;min-height:280px;">
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Galerie -->
<div class="ew-gallery wf-editable" data-ew-gallery-cols="3" data-ew-gallery-breakpoint="md">
  <div class="row g-3 ew-gallery-grid">
    <div class="col-md-4 ew-gallery-cell">
      <img src="/images/ordner/bild.jpg" class="img-fluid ew-gallery-image w-100" alt="Beschreibung">
    </div>
  </div>
</div>

<!-- FAQ -->
<div class="accordion ew-faq wf-editable w-100" id="ew-faq-beispiel"
     data-ew-faq='[{"q":"Frage?","a":"Antwort."}]'></div>

<!-- Downloads -->
<div class="ew-downloads wf-editable w-100"
     data-ew-downloads='[{"title":"Prospekt.pdf","url":"/files/prospekt.pdf"}]'></div>

<!-- PDF Flipbook -->
<div class="ew-pdf-flipbook wf-editable w-100" data-ew-pdf-src="/files/beispiel.pdf" data-ew-pdf-init=""></div>

<!-- YouTube (kein wf-editable) -->
<div class="ew-youtube" data-ew-youtube-src="https://www.youtube.com/embed/VIDEO_ID"></div>

<!-- Standort-Karte / Map (NICHT Feature-Box) — nur wenn Einstellungen → Karten aktiv -->
<div class="ew-map wf-editable w-100" style="min-height:400px"></div>

<!-- Formular -->
<div class="ew-form-container" data-ew-form-key="kontakt"></div>

<!-- Code Liquid-Zone -->
<!-- ew:zone type=liquid id=liquid-beispiel -->
{% comment %} Liquid {% endcomment %}
<!-- /ew:zone -->

<!-- Code HTML-Zone — absoluter Notfall für Raw-HTML -->
<!-- ew:zone type=html id=html-beispiel -->
<div>Freies HTML</div>
<!-- /ew:zone -->
